[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy /api requests to Nyaayukti Express Backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://nyaayukti-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
